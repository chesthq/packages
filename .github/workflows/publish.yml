name: Publish

# Tag-triggered npm publish. Tag pattern: <package-folder>-v<version>
#   sdk-v0.2.2             → publishes ./sdk @ 0.2.2 to @chest-gate/sdk
#   mcp-v0.2.2             → publishes ./mcp @ 0.2.2 to @chest-gate/mcp
#   cli-v0.3.0             → publishes ./cli @ 0.3.0 to @chest-gate/cli
#   proxy-v0.1.0           → publishes ./proxy @ 0.1.0 to @chest-gate/proxy
#   install-v0.1.2         → publishes ./install @ 0.1.2 to @chest-gate/install
#   upstream-proxy-v0.1.2  → publishes ./upstream-proxy @ 0.1.2 to @chest-gate/upstream-proxy
#
# Bump the package's `version` in its own package.json first, merge to main,
# then push the matching tag from main. The workflow refuses to publish if
# the tag version disagrees with package.json.

on:
  push:
    tags:
      - "sdk-v*"
      - "mcp-v*"
      - "cli-v*"
      - "proxy-v*"
      - "install-v*"
      - "upstream-proxy-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      # Trusted Publisher (OIDC) requires npm 11.5.1+. Node 22 ships npm
      # 10.x. Pin to a known-good version rather than `npm@latest` — a bad
      # self-upgrade (e.g. 11.14.x missing `promise-retry`) breaks all
      # publishes until it's fixed upstream. Bump deliberately when needed.
      - name: Install pinned npm for OIDC publishing
        run: npm install -g npm@11.5.1

      - name: Parse tag
        id: parse
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # Tag is "<folder>-v<version>". Folder may contain hyphens (upstream-proxy).
          folder="${tag%-v*}"
          version="${tag##*-v}"
          echo "folder=$folder" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Tag: $tag → folder=$folder version=$version"

      - name: Verify package.json version matches tag
        run: |
          folder="${{ steps.parse.outputs.folder }}"
          tag_version="${{ steps.parse.outputs.version }}"
          pkg_version=$(jq -r .version "./$folder/package.json")
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "::error::Tag version ($tag_version) does not match $folder/package.json version ($pkg_version). Bump package.json on main, then re-tag."
            exit 1
          fi
          echo "Versions match: $pkg_version"

      # Idempotency: backfilling a tag for an already-published version
      # (e.g. tagging the historical sdk-v0.2.1 commit) should no-op
      # gracefully, not fail with EPUBLISHCONFLICT.
      - name: Skip if already published
        id: skip
        run: |
          folder="${{ steps.parse.outputs.folder }}"
          tag_version="${{ steps.parse.outputs.version }}"
          pkg_name=$(jq -r .name "./$folder/package.json")
          if npm view "$pkg_name@$tag_version" version >/dev/null 2>&1; then
            echo "::notice::$pkg_name@$tag_version is already on npm — skipping publish (treating as backfill)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.skip.outputs.skip != 'true'
        run: npm ci --ignore-scripts

      - if: steps.skip.outputs.skip != 'true'
        name: Build
        run: npm run build --workspace=${{ steps.parse.outputs.folder }}

      # Auth handled by npm Trusted Publisher (OIDC). The id-token: write
      # permission above lets the npm CLI exchange the GitHub-issued OIDC
      # token for a short-lived registry token. No secret env var here —
      # an empty NODE_AUTH_TOKEN would break OIDC fallback.
      - if: steps.skip.outputs.skip != 'true'
        name: Publish
        run: npm publish --workspace=${{ steps.parse.outputs.folder }} --access public --provenance
