name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Build sdk
        run: npm run build --workspace=sdk

      - name: Build mcp
        run: npm run build --workspace=mcp

      - name: Build install
        run: npm run build --workspace=install

      - name: Build upstream-proxy
        run: npm run build --workspace=upstream-proxy
